name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Every test builds its own synthetic trace, so none of the suite needs
      # the 2.1 GB dataset. Four tests in test_loader.py additionally need
      # torch, which is an optional extra and is not installed here; they skip
      # with a reason rather than failing. Everything the headline result
      # depends on runs.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q
